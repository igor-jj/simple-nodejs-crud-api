<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style/login.css" />
  </head>
  <body>
    <div class="bg-canvas"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card">
      <div class="header">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <h2 class="card-title">Create your account</h2>
        <p class="card-subtitle">Sign up to get started</p>
        <div class="divider"><span></span><i></i><span></span></div>
      </div>

      <form class="form" id="registerForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            />
            <div class="input-line"></div>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              class="toggle-pw"
              aria-label="Show password"
              id="togglePw"
            >
              <!-- eye icon -->
              <svg id="eyeIcon" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <div class="input-line"></div>
          </div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="confirm-password"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              class="toggle-pw"
              aria-label="Show password"
              id="togglePwC"
            >
              <!-- eye icon -->
              <svg id="eyeIconC" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <div class="input-line"></div>
          </div>
        </div>

        <p id="error"></p>

        <button type="submit" class="btn-submit">
          <span>
            Sign up
            <svg class="btn-arrow" viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </span>
        </button>
      </form>

      <div class="card-footer">
        Already have an account? <a href="/frontend/signIn.html">Sign in</a>
      </div>
    </div>

    <script>
      // Password visibility toggle
      const togglePw = document.getElementById("togglePw");
      const togglePwC = document.getElementById("togglePwC"); //confirm
      const pwInput = document.getElementById("password");
      const pwInputC = document.getElementById("confirm-password"); //confirm
      const eyeIcon = document.getElementById("eyeIcon");
      const eyeIconC = document.getElementById("eyeIconC"); //confirm
      const eyeOff = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
      const eyeOn = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;

      togglePw.addEventListener("click", () => {
        const hidden = pwInput.type === "password";
        pwInput.type = hidden ? "text" : "password";
        eyeIcon.innerHTML = hidden ? eyeOff : eyeOn;
      });
      togglePwC.addEventListener("click", () => {
        const hidden = pwInputC.type === "password";
        pwInputC.type = hidden ? "text" : "password";
        eyeIconC.innerHTML = hidden ? eyeOff : eyeOn;
      });
    </script>

    <script type="module" src="/signUp.js"></script>
  </body>
</html>
