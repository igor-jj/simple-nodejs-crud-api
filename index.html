<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alunos | CRUD</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="app">
      <!-- FORM CARD -->
      <section class="card">
        <h2 id="modeText">Cadastrar Aluno</h2>
        <form>
          <div class="form-group">
            <label for="name">Nome</label>
            <input id="name" type="text" placeholder="Nome completo" required/>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="email@exemplo.com" required/>
          </div>

          <div class="form-group">
            <label for="ra">RA</label>
            <input id="ra" type="text" placeholder="Registro do aluno" required/>
          </div>

          <div class="actions">
            <button type="submit" class="btn-primary">Salvar</button>
            <button type="reset" class="btn-secondary">Limpar</button>
          </div>
        </form>
      </section>

      <!-- TABLE CARD -->
      <section class="card">
        <div class="header">
          <h1>Alunos</h1>
          <span class="badge">CRUD</span>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>RA</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <!-- Alunos serão renderizados aqui via JavaScript -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
